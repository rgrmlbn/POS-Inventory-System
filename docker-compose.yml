services:

  mysql:
    image: mysql:8.0
    container_name: default_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: default
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dental-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: default_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dental-net

  app:
    build: ./backend
    container_name: default_app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    networks:
      - default-net

  frontend:
    build: ./frontend
    container_name: default_frontend
    depends_on:
      - app
    ports:
      - "80:80"
    networks:
      - default-net

volumes:
  mysql_data:
  redis_data:

networks:
  default-net:
    driver: bridge