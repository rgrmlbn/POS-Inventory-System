spring.datasource.url=jdbc:mysql://mysql:3306/DB_NAME?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.data.redis.host=redis
spring.data.redis.port=6379

app.cors.allowed-origins=http://localhost:5173

spring.jackson.serialization.write-dates-as-timestamps=false

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

app.rate-limit.login.email.capacity=5
app.rate-limit.login.email.refill-minutes=15
app.rate-limit.login.ip.capacity=20
app.rate-limit.login.ip.refill-minutes=15

resend.api-key=${RESEND_API_KEY}
resend.from-email=onboarding@resend.dev
# CHANGE TO YOUR OWN DOMAIN
app.notification-email=${OWNER_EMAIL}