spring.datasource.url=jdbc:mysql://localhost:3306/default?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

app.cors.allowed-origins=http://localhost:5173

spring.jackson.serialization.write-dates-as-timestamps=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.flyway.enabled=true

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.cache.type=redis
spring.cache.redis.time-to-live=5m

logging.level.org.springframework.cache.interceptor.CacheAspectSupport=TRACE
logging.pattern.console=%d{HH:mm:ss} %msg%n

app.jwt.secret=${JWT_SECRET}
# 24 hours, dev only
app.jwt.access-token-expiration=86400000
# 7 days
app.jwt.refresh-token-expiration=604800000

# General limit: applies to every endpoint except login (per IP)
app.rate-limit.general.capacity=100
app.rate-limit.general.refill-minutes=1

# Login limit: stricter, applies only to the login endpoint (per IP)
app.rate-limit.login.capacity=3
app.rate-limit.login.refill-minutes=1

resend.api-key=${RESEND_API_KEY}
resend.from-email=onboarding@resend.dev
# CHANGE TO YOUR OWN DOMAIN
app.notification-email=${OWNER_EMAIL}

app.bootstrap-admin.name=Super Admin
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}