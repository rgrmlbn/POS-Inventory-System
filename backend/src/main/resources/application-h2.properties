# H2 in-memory datasource ? resets every restart, no MySQL needed
spring.datasource.url=jdbc:h2:mem:DB_NAME;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate dialect for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Auto-creates/drops tables based on your @Entity classes on every restart
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway must be off ? it expects a real persistent DB with migration history, not disposable in-memory H2
spring.flyway.enabled=false

# Enables the browser-based H2 console for inspecting data while the app runs
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Everything below is carried over from your dev profile ---

app.cors.allowed-origins=http://localhost:5173

spring.jackson.serialization.write-dates-as-timestamps=false

spring.data.redis.host=localhost
spring.data.redis.port=6379

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

app.rate-limit.login.email.capacity=5
app.rate-limit.login.email.refill-minutes=15
app.rate-limit.login.ip.capacity=20
app.rate-limit.login.ip.refill-minutes=15

resend.api-key=${RESEND_API_KEY}
resend.from-email=onboarding@resend.dev
# CHANGE TO YOUR OWN DOMAIN
app.notification-email=${OWNER_EMAIL}